<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Онлайн шашки</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #f1f1f1;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            padding: 20px 0;
            margin-bottom: 30px;
            border-bottom: 2px solid #0fcc45;
        }
        
        h1 {
            font-size: 2.8rem;
            background: linear-gradient(90deg, #0fcc45, #00d4ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1.2rem;
        }
        
        #auth {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 15px;
            padding: 30px;
            max-width: 500px;
            margin: 40px auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }
        
        #auth h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #0fcc45;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ddd;
        }
        
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(20, 20, 35, 0.8);
            color: #fff;
            font-size: 1rem;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: #0fcc45;
            box-shadow: 0 0 0 2px rgba(15, 204, 69, 0.3);
        }
        
        .btn {
            padding: 12px 25px;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(90deg, #0fcc45, #00b894);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(15, 204, 69, 0.4);
        }
        
        .btn-secondary {
            background: transparent;
            color: #0fcc45;
            border: 2px solid #0fcc45;
        }
        
        .btn-secondary:hover {
            background: rgba(15, 204, 69, 0.1);
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }
        
        #authMessage {
            margin-top: 15px;
            text-align: center;
            min-height: 25px;
            color: #ff6b6b;
        }
        
        #game {
            display: none;
            grid-template-columns: 1fr 350px;
            gap: 30px;
            margin-top: 20px;
        }
        
        #game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 30, 46, 0.8);
            border-radius: 10px;
        }
        
        #player-info {
            display: flex;
            gap: 20px;
        }
        
        .player-card {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 15px;
            background: rgba(20, 20, 35, 0.8);
            border-radius: 8px;
            min-width: 180px;
        }
        
        .player-card.active {
            border: 2px solid #0fcc45;
        }
        
        .player-color {
            width: 25px;
            height: 25px;
            border-radius: 50%;
        }
        
        .player1-color {
            background: #e74c3c;
        }
        
        .player2-color {
            background: #3498db;
        }
        
        #game-status {
            font-size: 1.3rem;
            font-weight: bold;
            color: #f1c40f;
        }
        
        #board-container {
            background: rgba(30, 30, 46, 0.8);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        
        #board {
            display: grid;
            grid-template-columns: repeat(8, 70px);
            grid-template-rows: repeat(8, 70px);
            margin: 0 auto;
            border: 3px solid #444;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
        }
        
        .cell {
            width: 70px;
            height: 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        .cell.light {
            background-color: #f0d9b5;
        }
        
        .cell.dark {
            background-color: #b58863;
        }
        
        .cell.selected {
            box-shadow: inset 0 0 0 4px #0fcc45;
        }
        
        .cell.available {
            box-shadow: inset 0 0 0 3px rgba(241, 196, 15, 0.8);
        }
        
        .cell.available::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(241, 196, 15, 0.6);
        }
        
        .checker {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            position: relative;
            z-index: 10;
            transition: all 0.2s ease;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .checker:hover {
            transform: scale(1.05);
        }
        
        .checker.player1 {
            background: radial-gradient(circle at 30% 30%, #e74c3c, #c0392b);
        }
        
        .checker.player2 {
            background: radial-gradient(circle at 30% 30%, #3498db, #2980b9);
        }
        
        .checker.king {
            box-shadow: 0 0 0 4px #f1c40f, 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        
        .checker.king::after {
            content: '♔';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #f1c40f;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.8);
        }
        
        #sidebar {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }
        
        .panel {
            background: rgba(30, 30, 46, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
            border: 1px solid #333;
        }
        
        .panel h3 {
            margin-bottom: 15px;
            color: #0fcc45;
            padding-bottom: 10px;
            border-bottom: 1px solid #444;
        }
        
        #chat-messages {
            height: 300px;
            overflow-y: auto;
            margin-bottom: 15px;
            padding: 10px;
            background: rgba(20, 20, 35, 0.6);
            border-radius: 8px;
        }
        
        .message {
            margin-bottom: 12px;
            padding: 8px 12px;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 8px;
            border-left: 3px solid #0fcc45;
        }
        
        .message .sender {
            font-weight: bold;
            color: #0fcc45;
            margin-right: 8px;
        }
        
        .message .time {
            font-size: 0.8rem;
            color: #888;
            float: right;
        }
        
        #message-input {
            display: flex;
            gap: 10px;
        }
        
        #message-input input {
            flex-grow: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(20, 20, 35, 0.8);
            color: #fff;
        }
        
        #users-list {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 8px;
            border-left: 4px solid transparent;
        }
        
        .user-item.current-user {
            border-left-color: #0fcc45;
        }
        
        .user-item.online {
            border-left-color: #2ecc71;
        }
        
        .user-info {
            flex-grow: 1;
        }
        
        .user-name {
            font-weight: bold;
            color: #ddd;
        }
        
        .user-rating {
            font-size: 0.9rem;
            color: #f1c40f;
        }
        
        .invite-btn {
            padding: 6px 12px;
            font-size: 0.9rem;
            background: transparent;
            color: #0fcc45;
            border: 1px solid #0fcc45;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .invite-btn:hover {
            background: rgba(15, 204, 69, 0.1);
        }
        
        #game-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        select {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(20, 20, 35, 0.8);
            color: #fff;
            font-size: 1rem;
        }
        
        #gameModes {
            display: flex;
            gap: 10px;
        }
        
        .mode-btn {
            flex-grow: 1;
            padding: 12px;
            text-align: center;
            background: rgba(40, 40, 60, 0.7);
            border-radius: 8px;
            border: 1px solid #444;
            color: #ddd;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .mode-btn.active {
            background: rgba(15, 204, 69, 0.2);
            border-color: #0fcc45;
            color: #0fcc45;
        }
        
        .mode-btn:hover {
            background: rgba(15, 204, 69, 0.1);
            border-color: #0fcc45;
        }
        
        #user-info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: rgba(30, 30, 46, 0.9);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        #user-stats {
            display: flex;
            gap: 20px;
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0fcc45;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #aaa;
        }
        
        .online-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        
        .online {
            background-color: #2ecc71;
        }
        
        .offline {
            background-color: #e74c3c;
        }
        
        @media (max-width: 1200px) {
            #game {
                grid-template-columns: 1fr;
            }
            
            #board {
                grid-template-columns: repeat(8, 60px);
                grid-template-rows: repeat(8, 60px);
            }
            
            .cell, .checker {
                width: 60px;
                height: 60px;
            }
        }
        
        @media (max-width: 768px) {
            #board {
                grid-template-columns: repeat(8, 50px);
                grid-template-rows: repeat(8, 50px);
            }
            
            .cell, .checker {
                width: 50px;
                height: 50px;
            }
            
            .btn-group {
                flex-direction: column;
            }
            
            #game-header {
                flex-direction: column;
                gap: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Онлайн шашки</h1>
            <p class="subtitle">Играйте с друзьями или с ботом. Повышайте свой рейтинг!</p>
        </header>
        
        <div id="auth">
            <h2>Вход / Регистрация</h2>
            <div class="input-group">
                <label for="login">Имя пользователя</label>
                <input type="text" id="login" placeholder="Введите имя пользователя">
            </div>
            <div class="input-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" placeholder="Введите пароль">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="register()">Регистрация</button>
                <button class="btn btn-secondary" onclick="login()">Вход</button>
            </div>
            <div id="authMessage"></div>
        </div>
        
        <div id="user-info-panel" style="display: none;">
            <div>
                <h2>Привет, <span id="currentUserName"></span>!</h2>
                <p>Рейтинг: <span id="currentUserRating" class="stat-value">0</span></p>
            </div>
            <div id="user-stats">
                <div class="stat">
                    <div class="stat-value" id="userWins">0</div>
                    <div class="stat-label">Победы</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="userLosses">0</div>
                    <div class="stat-label">Поражения</div>
                </div>
                <div class="stat">
                    <div class="stat-value" id="userDraws">0</div>
                    <div class="stat-label">Ничьи</div>
                </div>
            </div>
            <button class="btn btn-secondary" onclick="logout()">Выйти</button>
        </div>
        
        <div id="game">
            <div>
                <div id="game-header">
                    <div id="player-info">
                        <div class="player-card" id="player1-card">
                            <div class="player-color player1-color"></div>
                            <div>
                                <div id="player1-name">Игрок 1</div>
                                <div id="player1-rating">Рейтинг: 0</div>
                            </div>
                        </div>
                        <div class="player-card" id="player2-card">
                            <div class="player-color player2-color"></div>
                            <div>
                                <div id="player2-name">Игрок 2</div>
                                <div id="player2-rating">Рейтинг: 0</div>
                            </div>
                        </div>
                    </div>
                    <div id="game-status">Ожидание начала игры</div>
                </div>
                
                <div id="board-container">
                    <div id="board"></div>
                </div>
                
                <div id="game-controls" class="panel">
                    <h3>Управление игрой</h3>
                    <div class="controls-group">
                        <label>Режим игры:</label>
                        <div id="gameModes">
                            <div class="mode-btn active" onclick="setGameMode('bot')">Против бота</div>
                            <div class="mode-btn" onclick="setGameMode('online')">Онлайн</div>
                            <div class="mode-btn" onclick="setGameMode('local')">Локально</div>
                        </div>
                    </div>
                    
                    <div class="controls-group" id="bot-controls">
                        <label>Уровень сложности бота:</label>
                        <select id="botDifficulty">
                            <option value="easy">Легкий</option>
                            <option value="medium" selected>Средний</option>
                            <option value="hard">Сложный</option>
                        </select>
                    </div>
                    
                    <div class="controls-group">
                        <button class="btn btn-primary" onclick="startNewGame()">Новая игра</button>
                        <button class="btn btn-secondary" onclick="surrender()">Сдаться</button>
                        <button class="btn btn-secondary" onclick="checkForOnlineUpdates()">Проверить обновления</button>
                    </div>
                </div>
            </div>
            
            <div id="sidebar">
                <div class="panel">
                    <h3>Чат</h3>
                    <div id="chat-messages"></div>
                    <div id="message-input">
                        <input type="text" id="message" placeholder="Введите сообщение..." onkeypress="if(event.keyCode==13) sendMessage()">
                        <button class="btn btn-primary" onclick="sendMessage()">Отправить</button>
                    </div>
                </div>
                
                <div class="panel">
                    <h3>Онлайн пользователи <span id="online-count">(0)</span></h3>
                    <div id="users-list"></div>
                </div>
                
                <div class="panel" id="online-game-panel" style="display: none;">
                    <h3>Текущая онлайн-игра</h3>
                    <div id="online-game-info"></div>
                    <button class="btn btn-secondary" onclick="leaveOnlineGame()" style="width: 100%; margin-top: 10px;">Покинуть игру</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentUser = null;
        let gameMode = 'bot';
        let currentGame = null;
        let selectedChecker = null;
        let availableMoves = [];
        let boardState = [];
        let currentPlayer = 1;
        let gameActive = false;
        let botThinking = false;
        let onlineCheckInterval = null;
        let chatCheckInterval = null;
        let lastGameUpdate = 0;
        
        // Константы для LocalStorage ключей
        const STORAGE_KEYS = {
            USERS: 'checkers_users',
            GAMES: 'checkers_games',
            CHAT: 'checkers_chat',
            CURRENT_USER: 'checkers_current_user',
            GAME_HISTORY: 'checkers_game_history'
        };
        
        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            checkAuthStatus();
            initBoard();
            loadChatMessages();
            
            // Запуск интервалов для эмуляции онлайн-режима
            onlineCheckInterval = setInterval(updateOnlineStatus, 2000);
            chatCheckInterval = setInterval(loadChatMessages, 3000);
        });
        
        // ==================== АУТЕНТИФИКАЦИЯ ====================
        
        function hashPassword(password) {
            let hash = 0;
            for (let i = 0; i < password.length; i++) {
                const char = password.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString();
        }
        
        function register() {
            const username = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showAuthMessage('Пожалуйста, заполните все поля');
                return;
            }
            
            if (username.length < 3) {
                showAuthMessage('Имя пользователя должно быть не менее 3 символов');
                return;
            }
            
            if (password.length < 4) {
                showAuthMessage('Пароль должен быть не менее 4 символов');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            
            if (users.find(u => u.username === username)) {
                showAuthMessage('Пользователь с таким именем уже существует');
                return;
            }
            
            const newUser = {
                id: Date.now(),
                username: username,
                passwordHash: hashPassword(password),
                rating: 1000,
                wins: 0,
                losses: 0,
                draws: 0,
                lastOnline: Date.now(),
                status: 'online'
            };
            
            users.push(newUser);
            localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            
            loginUser(newUser);
        }
        
        function login() {
            const username = document.getElementById('login').value.trim();
            const password = document.getElementById('password').value.trim();
            
            if (!username || !password) {
                showAuthMessage('Пожалуйста, заполните все поля');
                return;
            }
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            const passwordHash = hashPassword(password);
            
            const user = users.find(u => u.username === username && u.passwordHash === passwordHash);
            
            if (user) {
                loginUser(user);
            } else {
                showAuthMessage('Неверное имя пользователя или пароль');
            }
        }
        
        function loginUser(user) {
            currentUser = user;
            currentUser.lastOnline = Date.now();
            currentUser.status = 'online';
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            const index = users.findIndex(u => u.id === user.id);
            if (index !== -1) {
                users[index] = currentUser;
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            }
            
            localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(currentUser));
            
            document.getElementById('auth').style.display = 'none';
            document.getElementById('user-info-panel').style.display = 'flex';
            document.getElementById('game').style.display = 'grid';
            
            document.getElementById('currentUserName').textContent = currentUser.username;
            document.getElementById('currentUserRating').textContent = currentUser.rating;
            document.getElementById('userWins').textContent = currentUser.wins;
            document.getElementById('userLosses').textContent = currentUser.losses;
            document.getElementById('userDraws').textContent = currentUser.draws;
            
            updateUsersList();
            loadChatMessages();
            
            // Проверка активных онлайн-игр
            checkActiveOnlineGames();
            
            setTimeout(() => startNewGame(), 500);
        }
        
        function checkAuthStatus() {
            const savedUser = localStorage.getItem(STORAGE_KEYS.CURRENT_USER);
            if (savedUser) {
                const user = JSON.parse(savedUser);
                const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
                const foundUser = users.find(u => u.id === user.id);
                
                if (foundUser) {
                    loginUser(foundUser);
                }
            }
        }
        
        function logout() {
            if (currentUser) {
                // Обновление статуса пользователя
                const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
                const index = users.findIndex(u => u.id === currentUser.id);
                if (index !== -1) {
                    users[index].status = 'offline';
                    users[index].lastOnline = Date.now();
                    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
                }
                
                // Выход из текущей онлайн-игры
                if (gameMode === 'online' && currentGame) {
                    leaveOnlineGame();
                }
            }
            
            currentUser = null;
            localStorage.removeItem(STORAGE_KEYS.CURRENT_USER);
            
            document.getElementById('auth').style.display = 'block';
            document.getElementById('user-info-panel').style.display = 'none';
            document.getElementById('game').style.display = 'none';
            
            document.getElementById('login').value = '';
            document.getElementById('password').value = '';
        }
        
        function showAuthMessage(message) {
            const authMessage = document.getElementById('authMessage');
            authMessage.textContent = message;
            setTimeout(() => { authMessage.textContent = ''; }, 3000);
        }
        
        // ==================== ИГРОВАЯ ДОСКА И ЛОГИКА ====================
        
        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    
                    cell.addEventListener('click', () => handleCellClick(row, col));
                    
                    board.appendChild(cell);
                }
            }
            
            resetBoard();
        }
        
        function resetBoard() {
            boardState = Array(8).fill().map(() => Array(8).fill(null));
            
            for (let row = 5; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        boardState[row][col] = { player: 1, king: false };
                    }
                }
            }
            
            for (let row = 0; row < 3; row++) {
                for (let col = 0; col < 8; col++) {
                    if ((row + col) % 2 === 1) {
                        boardState[row][col] = { player: 2, king: false };
                    }
                }
            }
            
            drawBoard();
        }
        
        function drawBoard() {
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('selected', 'available');
                cell.innerHTML = '';
            });
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const checker = boardState[row][col];
                    if (checker) {
                        const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
                        const checkerElement = document.createElement('div');
                        checkerElement.className = `checker player${checker.player}`;
                        if (checker.king) checkerElement.classList.add('king');
                        checkerElement.dataset.row = row;
                        checkerElement.dataset.col = col;
                        
                        checkerElement.addEventListener('click', (e) => {
                            e.stopPropagation();
                            handleCheckerClick(row, col);
                        });
                        
                        cell.appendChild(checkerElement);
                    }
                }
            }
            
            updatePlayerInfo();
        }
        
        function handleCheckerClick(row, col) {
            if (!gameActive || botThinking) return;
            
            // Для онлайн-игры проверяем, что это ход текущего пользователя
            if (gameMode === 'online' && currentGame) {
                const isPlayer1 = currentUser.username === currentGame.player1;
                const currentPlayerInGame = currentGame.currentPlayer;
                
                if ((isPlayer1 && currentPlayerInGame !== 1) || (!isPlayer1 && currentPlayerInGame !== 2)) {
                    showGameMessage('Сейчас не ваш ход!');
                    return;
                }
            }
            
            const checker = boardState[row][col];
            if (!checker) return;
            
            // Проверка, что игрок ходит своей шашкой
            const isPlayer1 = gameMode === 'online' && currentGame ? 
                currentUser.username === currentGame.player1 : 
                currentPlayer === 1;
            
            if ((isPlayer1 && checker.player !== 1) || (!isPlayer1 && checker.player !== 2)) {
                return;
            }
            
            if (selectedChecker && selectedChecker.row === row && selectedChecker.col === col) {
                selectedChecker = null;
                availableMoves = [];
                drawBoard();
                return;
            }
            
            selectedChecker = { row, col };
            availableMoves = getAvailableMoves(row, col);
            
            const allMoves = getAllPossibleMoves(checker.player);
            const captureMoves = allMoves.filter(move => move.captures.length > 0);
            
            if (captureMoves.length > 0) {
                const hasCapture = availableMoves.some(move => move.captures.length > 0);
                if (!hasCapture) {
                    selectedChecker = null;
                    availableMoves = [];
                    showGameMessage('Вы обязаны совершить взятие!');
                    return;
                }
                availableMoves = availableMoves.filter(move => move.captures.length > 0);
            }
            
            drawBoard();
            
            const cell = document.querySelector(`.cell[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('selected');
            
            availableMoves.forEach(move => {
                const targetCell = document.querySelector(`.cell[data-row="${move.row}"][data-col="${move.col}"]`);
                targetCell.classList.add('available');
            });
        }
        
        function handleCellClick(row, col) {
            if (!gameActive || !selectedChecker || botThinking) return;
            
            const move = availableMoves.find(m => m.row === row && m.col === col);
            if (!move) return;
            
            makeMove(selectedChecker.row, selectedChecker.col, row, col, move.captures);
            
            selectedChecker = null;
            availableMoves = [];
            
            // Для онлайн-игры сохраняем состояние
            if (gameMode === 'online' && currentGame) {
                saveOnlineGameState();
            }
            
            checkGameEnd();
            
            if (gameMode === 'bot' && currentPlayer === 2 && gameActive) {
                botThinking = true;
                setTimeout(makeBotMove, 500);
            }
        }
        
        function getAvailableMoves(row, col) {
            const checker = boardState[row][col];
            if (!checker) return [];
            
            const moves = [];
            const player = checker.player;
            const isKing = checker.king;
            
            checkDirection(row, col, player, isKing, moves);
            
            return moves;
        }
        
        function checkDirection(row, col, player, isKing, moves, captures = [], isFirst = true) {
            const directions = [];
            
            if (isKing) {
                directions.push([-1, -1], [-1, 1], [1, -1], [1, 1]);
            } else {
                const forward = player === 1 ? -1 : 1;
                directions.push([forward, -1], [forward, 1]);
            }
            
            for (const [dr, dc] of directions) {
                let newRow = row + dr;
                let newCol = col + dc;
                
                if (newRow < 0 || newRow >= 8 || newCol < 0 || newCol >= 8) continue;
                
                if (!boardState[newRow][newCol] && captures.length === 0 && isFirst) {
                    moves.push({ row: newRow, col: newCol, captures: [] });
                }
                else if (boardState[newRow][newCol] && boardState[newRow][newCol].player !== player) {
                    const jumpRow = newRow + dr;
                    const jumpCol = newCol + dc;
                    
                    if (jumpRow >= 0 && jumpRow < 8 && jumpCol >= 0 && jumpCol < 8 && !boardState[jumpRow][jumpCol]) {
                        if (!captures.some(c => c.row === newRow && c.col === newCol)) {
                            const newCaptures = [...captures, { row: newRow, col: newCol }];
                            moves.push({ row: jumpRow, col: jumpCol, captures: newCaptures });
                            
                            checkDirection(jumpRow, jumpCol, player, isKing, moves, newCaptures, false);
                        }
                    }
                }
            }
        }
        
        function getAllPossibleMoves(player) {
            const moves = [];
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const checker = boardState[row][col];
                    if (checker && checker.player === player) {
                        const checkerMoves = getAvailableMoves(row, col);
                        checkerMoves.forEach(move => {
                            moves.push({
                                from: { row, col },
                                to: { row: move.row, col: move.col },
                                captures: move.captures
                            });
                        });
                    }
                }
            }
            
            return moves;
        }
        
        function makeMove(fromRow, fromCol, toRow, toCol, captures) {
            const checker = boardState[fromRow][fromCol];
            
            boardState[toRow][toCol] = checker;
            boardState[fromRow][fromCol] = null;
            
            captures.forEach(capture => {
                boardState[capture.row][capture.col] = null;
            });
            
            if (!checker.king) {
                if ((checker.player === 1 && toRow === 0) || (checker.player === 2 && toRow === 7)) {
                    checker.king = true;
                    showGameMessage('Шашка превратилась в дамку!');
                }
            }
            
            const additionalMoves = getAvailableMoves(toRow, toCol).filter(move => move.captures.length > 0);
            
            if (captures.length > 0 && additionalMoves.length > 0) {
                selectedChecker = { row: toRow, col: toCol };
                availableMoves = additionalMoves;
                drawBoard();
                
                const cell = document.querySelector(`.cell[data-row="${toRow}"][data-col="${toCol}"]`);
                cell.classList.add('selected');
                
                availableMoves.forEach(move => {
                    const targetCell = document.querySelector(`.cell[data-row="${move.row}"][data-col="${move.col}"]`);
                    targetCell.classList.add('available');
                });
                
                return;
            }
            
            // Смена игрока
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            
            // Для онлайн-игры обновляем текущего игрока
            if (gameMode === 'online' && currentGame) {
                currentGame.currentPlayer = currentPlayer;
            }
            
            selectedChecker = null;
            availableMoves = [];
            
            drawBoard();
            updateGameStatus();
        }
        
        function checkGameEnd() {
            const player1Moves = getAllPossibleMoves(1);
            const player2Moves = getAllPossibleMoves(2);
            
            let player1Count = 0;
            let player2Count = 0;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const checker = boardState[row][col];
                    if (checker) {
                        if (checker.player === 1) player1Count++;
                        else player2Count++;
                    }
                }
            }
            
            if (player1Count === 0 || player1Moves.length === 0) {
                endGame(2);
                return;
            }
            
            if (player2Count === 0 || player2Moves.length === 0) {
                endGame(1);
                return;
            }
        }
        
        function endGame(winner) {
            gameActive = false;
            
            let message = '';
            if (gameMode === 'bot') {
                if (winner === 1) {
                    message = 'Вы победили!';
                    if (currentUser) {
                        updateUserStats('win');
                    }
                } else {
                    message = 'Бот победил!';
                    if (currentUser) {
                        updateUserStats('loss');
                    }
                }
            } else if (gameMode === 'local') {
                message = `Победил игрок ${winner}!`;
            } else {
                const winnerName = winner === 1 ? 
                    document.getElementById('player1-name').textContent : 
                    document.getElementById('player2-name').textContent;
                message = `Победил ${winnerName}!`;
                
                if (currentGame && currentGame.player1 && currentGame.player2) {
                    updateRatings(winner);
                }
            }
            
            showGameMessage(message);
            document.getElementById('game-status').textContent = `Игра завершена. ${message}`;
            
            // Для онлайн-игры отмечаем завершение
            if (gameMode === 'online' && currentGame) {
                completeOnlineGame(winner);
            }
            
            saveGameHistory(winner);
        }
        
        function updateUserStats(result) {
            if (!currentUser) return;
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            const index = users.findIndex(u => u.id === currentUser.id);
            
            if (index !== -1) {
                if (result === 'win') {
                    users[index].wins++;
                    users[index].rating += 10;
                } else if (result === 'loss') {
                    users[index].losses++;
                    users[index].rating = Math.max(0, users[index].rating - 10);
                } else {
                    users[index].draws++;
                }
                
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
                currentUser = users[index];
                localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(currentUser));
                
                document.getElementById('currentUserRating').textContent = currentUser.rating;
                document.getElementById('userWins').textContent = currentUser.wins;
                document.getElementById('userLosses').textContent = currentUser.losses;
                document.getElementById('userDraws').textContent = currentUser.draws;
            }
        }
        
        function updateRatings(winner) {
            const k = 32;
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            
            const player1Index = users.findIndex(u => u.username === currentGame.player1);
            const player2Index = users.findIndex(u => u.username === currentGame.player2);
            
            if (player1Index !== -1 && player2Index !== -1) {
                const r1 = users[player1Index].rating;
                const r2 = users[player2Index].rating;
                
                const e1 = 1 / (1 + Math.pow(10, (r2 - r1) / 400));
                const e2 = 1 / (1 + Math.pow(10, (r1 - r2) / 400));
                
                if (winner === 1) {
                    users[player1Index].rating = Math.round(r1 + k * (1 - e1));
                    users[player2Index].rating = Math.round(r2 + k * (0 - e2));
                    users[player1Index].wins++;
                    users[player2Index].losses++;
                } else {
                    users[player1Index].rating = Math.round(r1 + k * (0 - e1));
                    users[player2Index].rating = Math.round(r2 + k * (1 - e2));
                    users[player2Index].wins++;
                    users[player1Index].losses++;
                }
                
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
                
                if (currentUser && (currentUser.username === currentGame.player1 || currentUser.username === currentGame.player2)) {
                    const updatedUser = users.find(u => u.id === currentUser.id);
                    if (updatedUser) {
                        currentUser = updatedUser;
                        localStorage.setItem(STORAGE_KEYS.CURRENT_USER, JSON.stringify(currentUser));
                        
                        document.getElementById('currentUserRating').textContent = currentUser.rating;
                        document.getElementById('userWins').textContent = currentUser.wins;
                        document.getElementById('userLosses').textContent = currentUser.losses;
                    }
                }
            }
        }
        
        function saveGameHistory(winner) {
            const history = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAME_HISTORY)) || [];
            
            const gameRecord = {
                id: Date.now(),
                date: new Date().toISOString(),
                mode: gameMode,
                player1: document.getElementById('player1-name').textContent,
                player2: document.getElementById('player2-name').textContent,
                winner: winner,
                player1Rating: document.getElementById('player1-rating').textContent.replace('Рейтинг: ', ''),
                player2Rating: document.getElementById('player2-rating').textContent.replace('Рейтинг: ', '')
            };
            
            history.unshift(gameRecord);
            if (history.length > 50) history.pop();
            localStorage.setItem(STORAGE_KEYS.GAME_HISTORY, JSON.stringify(history));
        }
        
        // ==================== БОТ ====================
        
        function makeBotMove() {
            if (!gameActive || currentPlayer !== 2 || botThinking === false) return;
            
            const difficulty = document.getElementById('botDifficulty').value;
            let move;
            
            if (difficulty === 'easy') {
                move = getRandomBotMove();
            } else if (difficulty === 'medium') {
                move = getMinimaxBotMove(2);
            } else {
                move = getMinimaxBotMove(4);
            }
            
            if (move) {
                setTimeout(() => {
                    makeMove(move.from.row, move.from.col, move.to.row, move.to.col, move.captures);
                    botThinking = false;
                    checkGameEnd();
                }, 500);
            } else {
                botThinking = false;
            }
        }
        
        function getRandomBotMove() {
            const moves = getAllPossibleMoves(2);
            if (moves.length === 0) return null;
            
            const captureMoves = moves.filter(m => m.captures.length > 0);
            if (captureMoves.length > 0) {
                return captureMoves[Math.floor(Math.random() * captureMoves.length)];
            }
            
            return moves[Math.floor(Math.random() * moves.length)];
        }
        
        function getMinimaxBotMove(depth) {
            const moves = getAllPossibleMoves(2);
            if (moves.length === 0) return null;
            
            let bestMove = null;
            let bestValue = -Infinity;
            
            const captureMoves = moves.filter(m => m.captures.length > 0);
            const movesToCheck = captureMoves.length > 0 ? captureMoves : moves;
            
            for (const move of movesToCheck) {
                const boardCopy = JSON.parse(JSON.stringify(boardState));
                
                makeMove(move.from.row, move.from.col, move.to.row, move.to.col, move.captures);
                const moveValue = minimax(depth - 1, -Infinity, Infinity, false);
                
                boardState = boardCopy;
                
                if (moveValue > bestValue) {
                    bestValue = moveValue;
                    bestMove = move;
                }
            }
            
            return bestMove || getRandomBotMove();
        }
        
        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0) {
                return evaluateBoard();
            }
            
            const player = isMaximizing ? 2 : 1;
            const moves = getAllPossibleMoves(player);
            
            if (moves.length === 0) {
                return isMaximizing ? -1000 : 1000;
            }
            
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (const move of moves) {
                    const boardCopy = JSON.parse(JSON.stringify(boardState));
                    makeMove(move.from.row, move.from.col, move.to.row, move.to.col, move.captures);
                    
                    const evalResult = minimax(depth - 1, alpha, beta, false);
                    maxEval = Math.max(maxEval, evalResult);
                    
                    boardState = boardCopy;
                    
                    alpha = Math.max(alpha, evalResult);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (const move of moves) {
                    const boardCopy = JSON.parse(JSON.stringify(boardState));
                    makeMove(move.from.row, move.from.col, move.to.row, move.to.col, move.captures);
                    
                    const evalResult = minimax(depth - 1, alpha, beta, true);
                    minEval = Math.min(minEval, evalResult);
                    
                    boardState = boardCopy;
                    
                    beta = Math.min(beta, evalResult);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }
        
        function evaluateBoard() {
            let score = 0;
            
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const checker = boardState[row][col];
                    if (checker) {
                        let value = checker.king ? 3 : 1;
                        if (checker.player === 2) {
                            score += value;
                        } else {
                            score -= value;
                        }
                        
                        if (row >= 3 && row <= 4 && col >= 3 && col <= 4) {
                            score += checker.player === 2 ? 0.1 : -0.1;
                        }
                        
                        if (col === 0 || col === 7) {
                            score += checker.player === 2 ? 0.05 : -0.05;
                        }
                    }
                }
            }
            
            return score;
        }
        
        // ==================== ОНЛАЙН-РЕЖИМ ====================
        
        function setGameMode(mode) {
            gameMode = mode;
            
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            document.getElementById('bot-controls').style.display = mode === 'bot' ? 'block' : 'none';
            document.getElementById('online-game-panel').style.display = mode === 'online' ? 'block' : 'none';
            
            if (mode === 'online') {
                updateUsersList();
                checkActiveOnlineGames();
            } else {
                // Выход из онлайн-игры при смене режима
                if (currentGame && currentGame.mode === 'online') {
                    leaveOnlineGame();
                }
            }
            
            startNewGame();
        }
        
        function startNewGame() {
            gameActive = true;
            currentPlayer = 1;
            selectedChecker = null;
            availableMoves = [];
            botThinking = false;
            
            resetBoard();
            
            if (gameMode === 'bot') {
                document.getElementById('player1-name').textContent = currentUser ? currentUser.username : 'Игрок';
                document.getElementById('player1-rating').textContent = currentUser ? `Рейтинг: ${currentUser.rating}` : 'Рейтинг: 0';
                document.getElementById('player2-name').textContent = 'Бот';
                document.getElementById('player2-rating').textContent = 'Уровень: ' + document.getElementById('botDifficulty').value;
                
                currentPlayer = 1;
            } 
            else if (gameMode === 'local') {
                document.getElementById('player1-name').textContent = 'Игрок 1';
                document.getElementById('player1-rating').textContent = 'Локальная игра';
                document.getElementById('player2-name').textContent = 'Игрок 2';
                document.getElementById('player2-rating').textContent = 'Локальная игра';
            }
            else if (gameMode === 'online') {
                setupOnlineGame();
            }
            
            updateGameStatus();
            showGameMessage('Новая игра началась!');
        }
        
        function setupOnlineGame() {
            if (!currentUser) return;
            
            document.getElementById('player1-name').textContent = currentUser.username;
            document.getElementById('player1-rating').textContent = `Рейтинг: ${currentUser.rating}`;
            document.getElementById('player2-name').textContent = 'Ожидание соперника...';
            document.getElementById('player2-rating').textContent = 'Рейтинг: ?';
            
            // Проверяем, есть ли уже активная игра
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            const activeGame = games.find(g => 
                (g.player1 === currentUser.username || g.player2 === currentUser.username) &&
                g.status === 'active'
            );
            
            if (activeGame) {
                // Продолжаем существующую игру
                joinExistingOnlineGame(activeGame);
            } else {
                // Создаем новую игру или присоединяемся к ожидающей
                createOrJoinOnlineGame();
            }
        }
        
        function createOrJoinOnlineGame() {
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            
            // Ищем игру, ожидающую второго игрока
            const waitingGame = games.find(g => 
                g.status === 'waiting' && 
                g.player1 !== currentUser.username &&
                g.player2 === null
            );
            
            if (waitingGame) {
                // Присоединяемся к игре
                joinExistingOnlineGame(waitingGame, true);
            } else {
                // Создаем новую игру
                createNewOnlineGame();
            }
        }
        
        function createNewOnlineGame() {
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            
            currentGame = {
                id: 'game_' + Date.now(),
                player1: currentUser.username,
                player2: null,
                boardState: boardState,
                currentPlayer: 1,
                status: 'waiting',
                created: Date.now(),
                lastUpdate: Date.now(),
                mode: 'online'
            };
            
            games.push(currentGame);
            localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
            
            updateOnlineGameInfo();
            showGameMessage('Создана новая игра. Ожидание соперника...');
        }
        
        function joinExistingOnlineGame(game, isJoining = false) {
            if (isJoining) {
                game.player2 = currentUser.username;
                game.status = 'active';
                game.lastUpdate = Date.now();
                
                // Обновляем в хранилище
                const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
                const index = games.findIndex(g => g.id === game.id);
                if (index !== -1) {
                    games[index] = game;
                    localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
                }
                
                showGameMessage(`Вы присоединились к игре с ${game.player1}`);
            }
            
            currentGame = game;
            
            // Загружаем состояние доски
            if (game.boardState) {
                boardState = game.boardState;
                drawBoard();
            }
            
            // Определяем, за кого мы играем
            const isPlayer1 = currentUser.username === game.player1;
            currentPlayer = game.currentPlayer;
            
            // Обновляем отображение
            document.getElementById('player1-name').textContent = game.player1;
            document.getElementById('player2-name').textContent = game.player2 || 'Ожидание...';
            
            // Загружаем рейтинги
            updatePlayerRatings(game.player1, game.player2);
            
            updateGameStatus();
            updateOnlineGameInfo();
            
            gameActive = game.status === 'active';
        }
        
        function updatePlayerRatings(player1Name, player2Name) {
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            
            const player1 = users.find(u => u.username === player1Name);
            if (player1) {
                document.getElementById('player1-rating').textContent = `Рейтинг: ${player1.rating}`;
            }
            
            if (player2Name) {
                const player2 = users.find(u => u.username === player2Name);
                if (player2) {
                    document.getElementById('player2-rating').textContent = `Рейтинг: ${player2.rating}`;
                }
            }
        }
        
        function saveOnlineGameState() {
            if (!currentGame || gameMode !== 'online') return;
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            const index = games.findIndex(g => g.id === currentGame.id);
            
            if (index !== -1) {
                games[index].boardState = boardState;
                games[index].currentPlayer = currentPlayer;
                games[index].lastUpdate = Date.now();
                games[index].status = 'active';
                
                localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
                currentGame = games[index];
                
                lastGameUpdate = Date.now();
            }
        }
        
        function checkForOnlineUpdates() {
            if (gameMode !== 'online' || !currentGame) return;
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            const game = games.find(g => g.id === currentGame.id);
            
            if (!game) {
                showGameMessage('Игра не найдена');
                return;
            }
            
            if (game.lastUpdate > lastGameUpdate) {
                // Обновление получено
                boardState = game.boardState;
                currentPlayer = game.currentPlayer;
                currentGame = game;
                
                drawBoard();
                updateGameStatus();
                updateOnlineGameInfo();
                
                lastGameUpdate = Date.now();
                
                // Проверяем окончание игры
                checkGameEnd();
                
                showGameMessage('Состояние игры обновлено');
            } else {
                showGameMessage('Новых обновлений нет');
            }
        }
        
        function completeOnlineGame(winner) {
            if (!currentGame) return;
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            const index = games.findIndex(g => g.id === currentGame.id);
            
            if (index !== -1) {
                games[index].status = 'completed';
                games[index].winner = winner;
                games[index].lastUpdate = Date.now();
                
                localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
            }
        }
        
        function leaveOnlineGame() {
            if (!currentGame) return;
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            const index = games.findIndex(g => g.id === currentGame.id);
            
            if (index !== -1) {
                if (games[index].status === 'active') {
                    // Если игра активна, отмечаем сдачу
                    const winner = currentUser.username === currentGame.player1 ? 2 : 1;
                    games[index].status = 'surrendered';
                    games[index].winner = winner;
                    games[index].lastUpdate = Date.now();
                    
                    showGameMessage('Вы покинули игру. Засчитано поражение.');
                } else if (games[index].status === 'waiting') {
                    // Если игра ожидала игрока, удаляем ее
                    games.splice(index, 1);
                }
                
                localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
            }
            
            currentGame = null;
            document.getElementById('online-game-panel').style.display = 'none';
            
            // Возвращаемся к режиму бота
            setGameMode('bot');
        }
        
        function updateOnlineGameInfo() {
            if (!currentGame || gameMode !== 'online') {
                document.getElementById('online-game-panel').style.display = 'none';
                return;
            }
            
            document.getElementById('online-game-panel').style.display = 'block';
            
            const isPlayer1 = currentUser.username === currentGame.player1;
            const opponent = isPlayer1 ? currentGame.player2 : currentGame.player1;
            const status = currentGame.status === 'waiting' ? 'Ожидание соперника' : 
                          currentGame.status === 'active' ? 'Игра идет' : 
                          'Завершена';
            
            const info = `
                <p><strong>Оппонент:</strong> ${opponent || 'ожидание'}</p>
                <p><strong>Статус:</strong> ${status}</p>
                <p><strong>Ваша сторона:</strong> ${isPlayer1 ? 'Белые (ходят первыми)' : 'Черные'}</p>
                <p><strong>Текущий ход:</strong> ${currentGame.currentPlayer === 1 ? 'Белые' : 'Черные'}</p>
                <p><small>Последнее обновление: ${new Date(currentGame.lastUpdate).toLocaleTimeString()}</small></p>
            `;
            
            document.getElementById('online-game-info').innerHTML = info;
        }
        
        function checkActiveOnlineGames() {
            if (!currentUser || gameMode !== 'online') return;
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            
            // Проверяем, есть ли активные игры для текущего пользователя
            const activeGame = games.find(g => 
                (g.player1 === currentUser.username || g.player2 === currentUser.username) &&
                g.status === 'active'
            );
            
            if (activeGame && (!currentGame || currentGame.id !== activeGame.id)) {
                if (confirm('У вас есть активная онлайн-игра. Продолжить?')) {
                    joinExistingOnlineGame(activeGame);
                }
            }
        }
        
        // ==================== ПОЛЬЗОВАТЕЛИ И ЧАТ ====================
        
        function updateUsersList() {
            if (!currentUser) return;
            
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = '';
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            
            // Фильтруем и сортируем пользователей
            const onlineUsers = users
                .filter(u => u.id !== currentUser.id)
                .sort((a, b) => {
                    // Сначала онлайн, потом оффлайн
                    if (a.status === 'online' && b.status !== 'online') return -1;
                    if (a.status !== 'online' && b.status === 'online') return 1;
                    // Потом по рейтингу
                    return b.rating - a.rating;
                });
            
            // Добавляем текущего пользователя
            const currentUserElement = document.createElement('div');
            currentUserElement.className = 'user-item current-user';
            currentUserElement.innerHTML = `
                <div class="user-info">
                    <span class="online-indicator online"></span>
                    <div class="user-name">${currentUser.username} (Вы)</div>
                    <div class="user-rating">Рейтинг: ${currentUser.rating}</div>
                </div>
                <div class="user-status">Вы</div>
            `;
            usersList.appendChild(currentUserElement);
            
            // Добавляем остальных пользователей
            onlineUsers.forEach(user => {
                const isOnline = user.status === 'online' && (Date.now() - user.lastOnline) < 30000;
                const canInvite = isOnline && gameMode === 'online' && 
                                 (!currentGame || currentGame.status !== 'active');
                
                const userElement = document.createElement('div');
                userElement.className = `user-item ${isOnline ? 'online' : ''}`;
                userElement.innerHTML = `
                    <div class="user-info">
                        <span class="online-indicator ${isOnline ? 'online' : 'offline'}"></span>
                        <div class="user-name">${user.username}</div>
                        <div class="user-rating">Рейтинг: ${user.rating}</div>
                    </div>
                    ${canInvite ? `<button class="invite-btn" onclick="inviteUser('${user.username}')">Пригласить</button>` : 
                     isOnline ? '<span style="color: #2ecc71; font-size: 0.8rem;">● Онлайн</span>' : 
                     '<span style="color: #e74c3c; font-size: 0.8rem;">● Оффлайн</span>'}
                `;
                usersList.appendChild(userElement);
            });
            
            // Обновляем счетчик онлайн
            const onlineCount = users.filter(u => u.status === 'online' && (Date.now() - u.lastOnline) < 30000).length;
            document.getElementById('online-count').textContent = `(${onlineCount})`;
        }
        
        function updateOnlineStatus() {
            if (!currentUser) return;
            
            // Обновляем статус текущего пользователя
            currentUser.lastOnline = Date.now();
            currentUser.status = 'online';
            
            const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
            const index = users.findIndex(u => u.id === currentUser.id);
            if (index !== -1) {
                users[index] = currentUser;
                localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
            }
            
            // Для онлайн-игры проверяем обновления
            if (gameMode === 'online' && currentGame) {
                checkForOnlineUpdates();
            }
            
            // Обновляем список пользователей
            updateUsersList();
        }
        
        function inviteUser(username) {
            if (gameMode !== 'online') {
                showGameMessage('Переключитесь в онлайн-режим для приглашения игроков');
                return;
            }
            
            if (currentGame && currentGame.status === 'active') {
                showGameMessage('У вас уже есть активная игра');
                return;
            }
            
            const games = JSON.parse(localStorage.getItem(STORAGE_KEYS.GAMES)) || [];
            
            // Проверяем, не отправили ли уже приглашение этому пользователю
            const existingInvite = games.find(g => 
                g.player1 === currentUser.username && 
                g.player2 === username && 
                g.status === 'invited'
            );
            
            if (existingInvite) {
                showGameMessage(`Вы уже отправили приглашение ${username}`);
                return;
            }
            
            // Создаем приглашение
            const invite = {
                id: 'invite_' + Date.now(),
                player1: currentUser.username,
                player2: username,
                status: 'invited',
                created: Date.now(),
                lastUpdate: Date.now(),
                mode: 'online'
            };
            
            games.push(invite);
            localStorage.setItem(STORAGE_KEYS.GAMES, JSON.stringify(games));
            
            showGameMessage(`Приглашение отправлено ${username}`);
            
            // Добавляем сообщение в чат
            sendSystemMessage(`${currentUser.username} пригласил ${username} в игру`);
        }
        
        function loadChatMessages() {
            const chatMessages = document.getElementById('chat-messages');
            
            // Получаем сообщения из LocalStorage
            const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.CHAT)) || [];
            
            // Показываем только последние 50 сообщений
            const recentMessages = messages.slice(-50);
            
            chatMessages.innerHTML = '';
            
            recentMessages.forEach(msg => {
                const messageElement = document.createElement('div');
                messageElement.className = 'message';
                
                const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                if (msg.type === 'system') {
                    messageElement.innerHTML = `
                        <div>
                            <span style="color: #f1c40f;">[Система] ${msg.text}</span>
                            <span class="time">${time}</span>
                        </div>
                    `;
                } else {
                    messageElement.innerHTML = `
                        <div>
                            <span class="sender">${msg.sender}:</span>
                            <span class="text">${msg.text}</span>
                            <span class="time">${time}</span>
                        </div>
                    `;
                }
                
                chatMessages.appendChild(messageElement);
            });
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        function sendMessage() {
            const messageInput = document.getElementById('message');
            const text = messageInput.value.trim();
            
            if (!text || !currentUser) return;
            
            const message = {
                sender: currentUser.username,
                text: text,
                timestamp: Date.now(),
                type: 'user'
            };
            
            const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.CHAT)) || [];
            messages.push(message);
            
            if (messages.length > 200) {
                messages.splice(0, messages.length - 200);
            }
            
            localStorage.setItem(STORAGE_KEYS.CHAT, JSON.stringify(messages));
            
            messageInput.value = '';
            loadChatMessages();
        }
        
        function sendSystemMessage(text) {
            const message = {
                sender: 'Система',
                text: text,
                timestamp: Date.now(),
                type: 'system'
            };
            
            const messages = JSON.parse(localStorage.getItem(STORAGE_KEYS.CHAT)) || [];
            messages.push(message);
            
            if (messages.length > 200) {
                messages.splice(0, messages.length - 200);
            }
            
            localStorage.setItem(STORAGE_KEYS.CHAT, JSON.stringify(messages));
            loadChatMessages();
        }
        
        // ==================== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ====================
        
        function updatePlayerInfo() {
            document.getElementById('player1-card').classList.toggle('active', currentPlayer === 1);
            document.getElementById('player2-card').classList.toggle('active', currentPlayer === 2);
        }
        
        function updateGameStatus() {
            let status = '';
            
            if (!gameActive) {
                status = 'Игра завершена';
            } else if (gameMode === 'bot') {
                status = currentPlayer === 1 ? 'Ваш ход' : 'Ход бота...';
            } else if (gameMode === 'local') {
                status = `Ход игрока ${currentPlayer}`;
            } else if (gameMode === 'online') {
                if (currentGame) {
                    if (currentGame.status === 'waiting') {
                        status = 'Ожидание соперника...';
                    } else {
                        const isPlayer1 = currentUser.username === currentGame.player1;
                        const myTurn = (isPlayer1 && currentPlayer === 1) || (!isPlayer1 && currentPlayer === 2);
                        status = myTurn ? 'Ваш ход!' : 'Ход соперника...';
                    }
                } else {
                    status = 'Выберите соперника';
                }
            }
            
            document.getElementById('game-status').textContent = status;
        }
        
        function showGameMessage(message) {
            const gameStatus = document.getElementById('game-status');
            const originalText = gameStatus.textContent;
            
            gameStatus.textContent = message;
            gameStatus.style.color = '#f1c40f';
            
            setTimeout(() => {
                gameStatus.textContent = originalText;
                gameStatus.style.color = '';
            }, 3000);
        }
        
        function surrender() {
            if (!gameActive) return;
            
            if (confirm('Вы уверены, что хотите сдаться?')) {
                if (gameMode === 'bot') {
                    endGame(2);
                } else if (gameMode === 'local') {
                    endGame(currentPlayer === 1 ? 2 : 1);
                } else if (gameMode === 'online') {
                    if (currentGame) {
                        const winner = currentUser.username === currentGame.player1 ? 2 : 1;
                        endGame(winner);
                    }
                }
            }
        }
        
        // Очистка интервалов при закрытии страницы
        window.addEventListener('beforeunload', function() {
            if (onlineCheckInterval) clearInterval(onlineCheckInterval);
            if (chatCheckInterval) clearInterval(chatCheckInterval);
            
            // Обновляем статус пользователя при выходе
            if (currentUser) {
                const users = JSON.parse(localStorage.getItem(STORAGE_KEYS.USERS)) || [];
                const index = users.findIndex(u => u.id === currentUser.id);
                if (index !== -1) {
                    users[index].lastOnline = Date.now();
                    users[index].status = 'offline';
                    localStorage.setItem(STORAGE_KEYS.USERS, JSON.stringify(users));
                }
            }
        });
    </script>
</body>
